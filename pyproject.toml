[project]
name = "udemy-python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.3.0",
    "pandas>=2.3.0,<3",
    "chromadb>=1.0.13",
    "faiss-cpu>=1.11.0",
    "langchain>=0.3.26",
    "langchain-community>=0.3.26",
    "langchain-text-splitters>=0.3.8",
    "langchain-groq>=0.3.4",
    "pypdf>=5.7.0",
    "python-dotenv>=1.1.1",
    "sentence-transformers>=4.1.0",
    "tiktoken>=0.9.0",
    "llama-index-readers-file>=0.4.8",
    "llama-index-embeddings-huggingface>=0.5.5",
    "llama-index-llms-openai-like>=0.4.0",
    "llama-index-llms-groq>=0.3.0",
    "llama-index-vector-stores-chroma>=0.5.5",
    "llama-index-vector-stores-pinecone>=0.5.0",
]

[project.scripts]
udemy-python = "udemy_python:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
